name: Build & Verify PawSync OTA Container

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify pawsync_ota_update.bin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install System Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential

      - name: Run Automated CLI Build Wizard
        run: |
          ./build.sh --auto

      - name: Validate Container Integrity
        run: |
          ./.venv/bin/python tools/verify_ota.py pawsync_ota_update.bin

      - name: Compute Checksums
        run: |
          sha256sum pawsync_ota_update.bin > checksums.txt
          cat checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pawsync_ota_update
          path: |
            pawsync_ota_update.bin
            checksums.txt
          if-no-files-found: error
