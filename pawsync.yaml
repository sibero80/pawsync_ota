substitutions:
  name: "pawsync-feeder"
  friendly_name: "Pawsync PPF-R361S Feeder"
  timezone: "America/New_York"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  comment: "Local ESPHome firmware for Pawsync PPF-R361S Pet Feeder with Zero-Touch Dynamic Wi-Fi & Backup (v1.5.0)"
  project:
    name: "sibero80.pawsync_ota"
    version: "1.5.0"
  min_version: 2024.6.0
  on_boot:
    - priority: -100.0
      then:
        - lambda: |-
            id(feeder_bridge).set_grams_per_portion_number(id(kibble_grams_per_portion));
            id(kibble_grams_per_portion).publish_state(id(feeder_bridge).get_grams_per_portion());
            uint8_t p = id(feeder_bridge).get_active_plan();
            const char *plans[] = {
              "Plan 1 (Daily)", "Plan 2 (Weekdays)", "Plan 3 (Weekends)",
              "Plan 4 (Custom 1)", "Plan 5 (Custom 2)", "Plan 6 (Custom 3)", "Plan 7 (Custom 4)"
            };
            if (p < 7) {
              id(select_active_plan).publish_state(plans[p]);
            }

dashboard_import:
  package_import_url: github://sibero80/pawsync_ota/pawsync.yaml@main
  import_full_config: true

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_LWIP_MAX_SOCKETS: "16"
  partitions: partitions.csv

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO
  baud_rate: 0  # Disable logger UART to prevent interference with SC95F8766P link

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  services:
    # Service: Feed immediately with custom portion count (1..20)
    - service: feed
      description: "Dispense a specific number of kibble portions immediately."
      variables:
        portions:
          type: int
          description: "Number of portions to dispense (1 to 20, ~8-10g per portion)."
          example: "1"
      then:
        - lambda: |-
            if (portions < 1 || portions > 20) {
              ESP_LOGW("service", "feed rejected: portions %d out of range (1-20)", portions);
              return;
            }
            id(feeder_bridge).feed(portions, true);

    # Service: Trigger stock single-meal kibble density calibration (opcode 0x5599)
    - service: measure_meal_stock
      description: "Trigger immediate food hopper level measurement and weight calibration."
      then:
        - lambda: |-
            id(feeder_bridge).start_stock_measuring();

    # Service: Configure on-device meal schedule (7 plans x 10 meals)
    - service: set_meal_schedule
      description: "Configure or update a scheduled meal slot in the feeder's local memory."
      variables:
        plan:
          type: int
          description: "Plan index (1 to 7, or 0 to use the currently active plan)."
          example: "1"
        meal:
          type: int
          description: "Meal slot index (1 to 10)."
          example: "1"
        enabled:
          type: bool
          description: "Enable (true) or disable (false) this scheduled meal."
          example: "true"
        meal_time:
          type: string
          description: "Feeding time in local 24-hour format HH:MM (e.g. 08:30 or 18:00)."
          example: "08:30"
        days:
          type: string
          description: "Repeat days: 'All', 'Weekdays', 'Weekends', or comma-separated days 'Mo,Tu,We,Th,Fr,Sa,Su'."
          example: "All"
        portions:
          type: int
          description: "Number of portions to dispense (1 to 20)."
          example: "2"
        sound:
          type: bool
          description: "Play chime sound when meal is dispensed."
          example: "true"
      then:
        - lambda: |-
            if (plan < 0 || plan > 7) {
              ESP_LOGW("schedule", "set_meal_schedule rejected: plan %d out of range (0-7)", plan);
              return;
            }
            if (meal < 1 || meal > 10) {
              ESP_LOGW("schedule", "set_meal_schedule rejected: meal %d out of range (1-10)", meal);
              return;
            }
            if (portions < 1 || portions > 20) {
              ESP_LOGW("schedule", "set_meal_schedule rejected: portions %d out of range (1-20)", portions);
              return;
            }
            uint8_t p = (plan >= 1 && plan <= 7) ? (plan - 1) : id(feeder_bridge).get_active_plan();
            uint8_t m = meal - 1;

            uint8_t h = 0, min = 0;
            if (enabled && !id(feeder_bridge).parse_time_string(meal_time, h, min)) {
              ESP_LOGE("schedule", "Invalid time format '%s' (expected HH:MM)", meal_time.c_str());
              return;
            }

            uint8_t d = id(feeder_bridge).parse_days_string(days);
            id(feeder_bridge).set_meal_schedule(p, m, enabled, h, min, portions, d, sound);

    # Service: Clear all meals in a plan
    - service: clear_plan
      description: "Disable and clear all 10 scheduled meal slots in a plan."
      variables:
        plan:
          type: int
          description: "Plan index (1 to 7, or 0 to clear the active plan)."
          example: "1"
      then:
        - lambda: |-
            if (plan < 0 || plan > 7) {
              ESP_LOGW("schedule", "clear_plan rejected: plan %d out of range (0-7)", plan);
              return;
            }
            uint8_t p = (plan >= 1 && plan <= 7) ? (plan - 1) : id(feeder_bridge).get_active_plan();
            id(feeder_bridge).clear_plan(p);

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pawsync-Feeder-Fallback"
    password: "pawsync1234"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time_sync:
      then:
        - ppf_r361s.sync_clock:
            id: feeder_bridge
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - time.google.com
    on_time_sync:
      then:
        - ppf_r361s.sync_clock:
            id: feeder_bridge

uart:
  - id: uart_coprocessor
    tx_pin: GPIO19
    rx_pin: GPIO18
    baud_rate: 115200

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO1
    i2s_bclk_pin: GPIO4

speaker:
  - platform: i2s_audio
    id: feeder_speaker_out
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO5
    sample_rate: 32000
    channel: mono

media_player:
  - platform: speaker
    id: feeder_speaker
    name: "Meal Call Speaker"
    buffer_size: 16000
    announcement_pipeline:
      speaker: feeder_speaker_out
    on_announcement:
      - switch.turn_on: amp_enable
    on_idle:
      - switch.turn_off: amp_enable

output:
  - platform: gpio
    pin: GPIO0
    id: amp_enable_output

switch:
  - platform: output
    id: amp_enable
    name: "Amplifier Enable"
    output: amp_enable_output
    internal: true
  - platform: ppf_r361s
    child_lock:
      name: "Child Lock"
      restore_mode: RESTORE_DEFAULT_OFF
    slow_feed:
      name: "Slow Feed Mode"
    sleep_mode:
      name: "Sleep Mode"
    intelligent_feeding:
      name: "Intelligent Feeding (Leftover Deduction)"
    stock_calibration:
      name: "Stock Calibration Mode (6-Portion Cycle)"
      icon: "mdi:rotate-right"
    tank_projection_mode:
      name: "Tank Projection: Rolling Average Mode"
      icon: "mdi:chart-timeline-variant"
    manual_feed_chime:
      name: "Manual Feed Chime"
      icon: "mdi:bell-ring"
    scheduled_feed_chime:
      name: "Scheduled Feed Chime"
      icon: "mdi:bell-badge"
    precision_mode:
      name: "Precision Mode (Closed-Loop Compensation)"
      icon: "mdi:target-variant"
  - platform: template
    name: "Unlock Factory Firmware Rollback"
    id: sw_unlock_factory_rollback
    icon: mdi:lock-alert
    entity_category: config
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - logger.log: "WARNING: Factory firmware rollback interlock has been UNLOCKED!"
    turn_off_action:
      - logger.log: "Factory firmware rollback interlock is LOCKED."
  - platform: template
    name: "Allow Overwriting Stock Slot"
    id: sw_allow_overwrite_stock
    icon: mdi:shield-alert
    entity_category: config
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(feeder_bridge).set_allow_overwrite_stock(true);
      - logger.log: "WARNING: Overwrite protection for factory stock slot (ota_1) has been DISABLED!"
    turn_off_action:
      - lambda: |-
          id(feeder_bridge).set_allow_overwrite_stock(false);
      - logger.log: "Protection active: Overwriting factory stock slot is BLOCKED."

ppf_r361s:
  id: feeder_bridge
  uart_id: uart_coprocessor
  time_id: sntp_time
  on_meal_eaten:
    - homeassistant.event:
        event: esphome.pawsync_meal_eaten
        data:
          consumed_g: !lambda 'return consumed_g;'
          duration_s: !lambda 'return duration_s;'
          speed_g_per_min: !lambda 'return speed_g_per_min;'
  on_feed_completed:
    - homeassistant.event:
        event: esphome.pawsync_feed_completed
        data:
          portions: !lambda 'return portions;'
          weight_g: !lambda 'return weight_g;'
  on_tank_low:
    - homeassistant.event:
        event: esphome.pawsync_tank_low
        data:
          remaining_g: !lambda 'return remaining_g;'
          days_left: !lambda 'return days_left;'

sensor:
  - platform: ppf_r361s
    bowl_weight:
      name: "Bowl Weight"
    battery_level:
      name: "Battery Level"
    last_feed_weight:
      name: "Last Feed Weight"
    portions_today:
      name: "Portions Today"
    desiccant_days:
      name: "Desiccant Days Remaining"
    cleaning_days:
      name: "Chute Cleaning Days Remaining"
    last_meal_consumed:
      name: "Last Meal Amount Consumed"
    last_meal_duration:
      name: "Last Meal Duration"
    eating_speed:
      name: "Last Meal Eating Speed"
    total_eaten_today:
      name: "Total Eaten Today"
    food_in_tank:
      name: "Food in Tank"
    food_tank_level:
      name: "Food Tank Level"
    days_to_empty_tank:
      name: "Days to Empty Tank"
  - platform: uptime
    name: "Uptime"
    id: sensor_uptime
    entity_category: diagnostic
    icon: "mdi:timer-outline"
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: sensor_wifi_signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: template
    name: "Free Heap"
    id: sensor_free_heap
    unit_of_measurement: "bytes"
    entity_category: diagnostic
    icon: "mdi:memory"
    lambda: |-
      return (float) esp_get_free_heap_size();
    update_interval: 60s
  - platform: template
    name: "Max Free Heap Block"
    id: sensor_max_free_heap_block
    unit_of_measurement: "bytes"
    entity_category: diagnostic
    icon: "mdi:memory-arrow-down"
    lambda: |-
      return (float) heap_caps_get_largest_free_block(MALLOC_CAP_DEFAULT);
    update_interval: 60s
  - platform: template
    name: "Max lwIP Sockets"
    id: sensor_max_lwip_sockets
    entity_category: diagnostic
    icon: "mdi:lan-connect"
    lambda: |-
      #if defined(USE_ESP_IDF)
      return (float) (CONFIG_LWIP_MAX_SOCKETS);
      #else
      return 16.0f;
      #endif
    update_interval: 60s

binary_sensor:
  - platform: ppf_r361s
    power_adapter:
      name: "AC Power Connected"
    food_low:
      name: "Food Level Low"
    food_empty:
      name: "Food Tank Empty"
    motor_jammed:
      name: "Motor Jammed"
    bowl_overflow:
      name: "Bowl Overflow (>150g)"
    scale_overload:
      name: "Scale Overload (>1000g)"
    bowl_connected:
      name: "Bowl Scale Connected"
    scale_tray_connected:
      name: "Scale Tray Connected"
    bowl_present:
      name: "Food Bowl Present"
    battery_installed:
      name: "Battery Installed"
    battery_low:
      name: "Battery Low (<20%)"
    cleaning_due:
      name: "Chute Cleaning Due"
    pet_eating:
      name: "Pet Eating"
    abnormal_eating:
      name: "Abnormal Eating Detected"

text_sensor:
  - platform: ppf_r361s
    status:
      name: "Feeder Status"
    next_meal:
      name: "Next Scheduled Meal"
    schedule_summary:
      name: "Today's Schedule Summary"
    last_meal_time:
      name: "Last Meal Time"
    last_adjusted_meal:
      name: "Last Adjusted Meal"
    last_adjusted_meal_notes:
      name: "Last Adjusted Meal Notes"
    food_tank_category:
      name: "Food Tank Category"
    last_refill_time:
      name: "Last Refill Time"
  - platform: template
    name: "Firmware Version"
    id: firmware_version
    entity_category: diagnostic
    icon: "mdi:tag-outline"
    update_interval: never
    lambda: |-
      return std::string(ESPHOME_PROJECT_VERSION);

button:
  - platform: ppf_r361s
    tare:
      name: "Tare Bowl Scale"
    feed:
      name: "Feed 1 Portion"
      portions: 1
      sound: true
    calibrate_portion:
      name: "Calibrate Kibble Density (Empty Bowl First)"
    reset_desiccant:
      name: "Reset Desiccant (30 Days)"
    reset_cleaning:
      name: "Reset Chute Cleaning (30 Days)"
    reset_tank_food:
      name: "Reset Tank Food (Refill)"
  - platform: template
    name: "Feed Selected Portions"
    id: btn_feed_manual_portions
    icon: mdi:food-drumstick-outline
    on_press:
      - lambda: |-
          id(feeder_bridge).feed_manual_portions();
  - platform: template
    name: "Rollback to Factory Firmware (Slot ota_1)"
    id: btn_rollback_stock
    icon: mdi:backup-restore
    entity_category: config
    on_press:
      - then:
          - lambda: !lambda |-
              if (!id(sw_unlock_factory_rollback).state) {
                ESP_LOGW("rollback", "Rollback rejected: 'Unlock Factory Firmware Rollback' switch is OFF. Turn ON the unlock switch first.");
                return;
              }
              id(feeder_bridge).rollback_to_stock_firmware();

number:
  - platform: ppf_r361s
    feed_portions:
      name: "Manual Feed Portions"
    tank_refill_volume:
      name: "Tank Refill Volume"
    tank_refill_weight:
      name: "Tank Refill Weight (Optional)"
  - platform: template
    name: "Grams per Portion (Kibble Calibration)"
    id: kibble_grams_per_portion
    min_value: 3.0
    max_value: 20.0
    step: 0.1
    initial_value: 8.0
    restore_value: false
    unit_of_measurement: "g"
    icon: "mdi:scale"
    set_action:
      - lambda: |-
          id(feeder_bridge).set_grams_per_portion(x);

# --- On-Device Schedule Interactive UI (Mapped to Plan 1 Meals 1-4) ---
select:
  - platform: template
    name: "Active Feeding Plan"
    id: select_active_plan
    options:
      - "Plan 1 (Daily)"
      - "Plan 2 (Weekdays)"
      - "Plan 3 (Weekends)"
      - "Plan 4 (Custom 1)"
      - "Plan 5 (Custom 2)"
      - "Plan 6 (Custom 3)"
      - "Plan 7 (Custom 4)"
    initial_option: "Plan 1 (Daily)"
    restore_value: false
    set_action:
      - lambda: |-
          uint8_t p = 1;
          if (x == "Plan 2 (Weekdays)") p = 2;
          else if (x == "Plan 3 (Weekends)") p = 3;
          else if (x == "Plan 4 (Custom 1)") p = 4;
          else if (x == "Plan 5 (Custom 2)") p = 5;
          else if (x == "Plan 6 (Custom 3)") p = 6;
          else if (x == "Plan 7 (Custom 4)") p = 7;
          id(feeder_bridge).set_active_plan(p - 1);
